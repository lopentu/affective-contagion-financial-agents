[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "affective-contagion-financial-agents"
version = "0.1.0"
description = "Causal measurement and mitigation of affective language propagation in financial LLM-agent teams"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.11",
  "pyyaml>=6.0.2",
  "scipy>=1.14",
]

[project.optional-dependencies]
experiment = [
  "accelerate>=1.9",
  "bitsandbytes>=0.46; platform_system == 'Linux'",
  "outlines>=1.3",
  "torch>=2.7",
  "tqdm>=4.67",
  "transformers>=4.53",
]

[dependency-groups]
dev = [
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-cov>=6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/affective_contagion"]

[tool.hatch.build.targets.sdist]
exclude = ["/.coverage"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=affective_contagion --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
  "src/affective_contagion/backends/*", # Requires multi-GB model dependencies and hardware.
]

[tool.ruff]
# Keep the existing Python 3.11 syntax style; runtime and type checks require 3.13.
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY001",  # One repository-level license is sufficient.
  "COM812",  # Conflicts with the formatter.
  "D203",    # Prefer no blank line before class docstrings.
  "D213",    # Prefer summary on the first docstring line.
  "PLR2004", # Scientific test values are often clearer inline.
  "PLR0913", # Scientific orchestration is clearer with explicit named parameters.
  "TC001",   # Keep schema/protocol annotations inspectable at runtime.
  "TC002",
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/**/*.py" = ["BLE001", "T201"]
"src/affective_contagion/backends/**/*.py" = ["ANN401", "PLC0415"]
"src/affective_contagion/storage.py" = ["ANN401"]
"src/affective_contagion/provenance.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["affective_contagion"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
possibly-unresolved-reference = "error"
