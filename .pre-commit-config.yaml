repos:
  - repo: local
    hooks:
      - id: ruff-check-fix
        name: ruff check --fix
        entry: uvx ruff check --fix .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uvx ruff format .
        language: system
        pass_filenames: false
        always_run: true
      - id: ty-check
        name: ty check
        entry: uvx ty check
        language: system
        pass_filenames: false
        always_run: true
